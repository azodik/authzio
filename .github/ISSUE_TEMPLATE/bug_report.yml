name: Bug report
description: Report a defect in Authzio
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. For security issues, do **not** open a public issue — see [SECURITY.md](../SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / build
      description: e.g. 0.0.1 (Build 12) or commit SHA
      placeholder: 0.0.1
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install type
      options:
        - Docker / Compose
        - Self-host (Herd / bare metal)
        - Authzio Cloud
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
