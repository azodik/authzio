; Authzio Supervisor — queue workers + scheduler + Nightwatch agent (VPS)
; Placeholders replaced by deploy.sh
; Single queue: default (Laravel Cloud / self-host)

[program:authzio-queue]
command=__PHP_BIN__ __APP_ROOT__/artisan queue:work --queue=default --sleep=1 --tries=3 --max-time=3600 --memory=256
directory=__APP_ROOT__
user=__APP_USER__
numprocs=__QUEUE_WORKERS__
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/authzio/queue.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[program:authzio-scheduler]
command=__PHP_BIN__ __APP_ROOT__/artisan schedule:work
directory=__APP_ROOT__
user=__APP_USER__
numprocs=1
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/authzio/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:authzio-nightwatch]
command=__PHP_BIN__ __APP_ROOT__/artisan nightwatch:agent
directory=__APP_ROOT__
user=__APP_USER__
numprocs=1
autostart=__NIGHTWATCH_AUTOSTART__
autorestart=__NIGHTWATCH_AUTOSTART__
startsecs=2
stopwaitsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/authzio/nightwatch.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[group:authzio]
programs=authzio-queue,authzio-scheduler,authzio-nightwatch
