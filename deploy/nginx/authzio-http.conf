# Authzio HTTP-only bootstrap (before certificates exist)
# Used so Certbot can complete ACME, then replaced by full HTTPS config.

server {
    listen 80;
    listen [::]:80;
    server_name __PRIMARY_DOMAIN__ __WWW_DOMAIN__;
    root __APP_ROOT__/public;
    index index.php;

    client_max_body_size 10M;
    client_header_buffer_size 16k;
    large_client_header_buffers 4 32k;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        allow all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php__PHP_VERSION__-fpm-authzio.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    location ~* /\. {
        deny all;
        return 404;
    }

    location ~* (?:^|/)\.env(?:$|\.) {
        deny all;
        return 404;
    }
}
