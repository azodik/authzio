# Authzio nginx — placeholders replaced by deploy.sh
# __PRIMARY_DOMAIN__ = canonical host (https://PRIMARY)
# __WWW_DOMAIN__     = www counterpart (always redirected to PRIMARY)
# __APP_ROOT__       = application root (document root = public/)
# __PHP_VERSION__    = e.g. 8.5
# __SSL_CERT__ / __SSL_KEY__ = Let's Encrypt paths (HTTPS block only when present)

# ACME + force HTTPS (both hosts)
server {
    listen 80;
    listen [::]:80;
    server_name __PRIMARY_DOMAIN__ __WWW_DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root __APP_ROOT__/public;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://__PRIMARY_DOMAIN__$request_uri;
    }
}

# www → canonical (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __WWW_DOMAIN__;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://__PRIMARY_DOMAIN__$request_uri;
}

# Canonical HTTPS app
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __PRIMARY_DOMAIN__;
    root __APP_ROOT__/public;
    index index.php;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;
    client_header_buffer_size 16k;
    large_client_header_buffers 4 32k;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php__PHP_VERSION__-fpm-authzio.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Never serve dotfiles (.env, .git, …) — document root is public/, this is defense-in-depth
    location ~* /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Block sensitive names if ever linked under public/
    location ~* (?:^|/)\.env(?:$|\.) {
        deny all;
        return 404;
    }

    location ~* ^/(?:storage|vendor|node_modules|tests|deploy|bootstrap|config|database|routes|app)/ {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/authzio.access.log;
    error_log  /var/log/nginx/authzio.error.log;
}
