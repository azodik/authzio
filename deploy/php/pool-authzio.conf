; Authzio PHP-FPM pool — placeholders replaced by deploy.sh
[authzio]
user = __APP_USER__
group = __APP_GROUP__
listen = /run/php/php__PHP_VERSION__-fpm-authzio.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

chdir = __APP_ROOT__
catch_workers_output = yes
decorate_workers_output = no
clear_env = no

php_admin_value[error_log] = /var/log/authzio/php-fpm.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M
